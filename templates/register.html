{% extends "base.html" %}

<!-- Titulo pasado a la pestaña del navegador -->
{% block title %}Registro{% endblock %}

{% block content %}

<div class="containerPrincipal">
    <div class="encabezados">
        <img src="{{ url_for('static', filename='images/mamApp.jpg') }}" alt="Logo MamApp" class="logo">
        <h1 id="titulo">MAM APP test</h1>
    </div>

    <form class="contenedorCentral" action="/registrar" method="POST">
        <div class="gridFormas">

            <!-- Filas de la forma -->

            <!-- Primera fila -->
            <div class="campoCompleto">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>

            <!-- Segunda fila -->
            <div class="campoCompleto">
                <label for="contraseña">Contraseña</label>
                <input type="password" name="contraseña" id="contraseña" required>
            </div>

            <button type="submit" class="botones" id="botonRegistrar">Registrar</button>
            <a href="{{ url_for('login') }}">
                <button type="button" class="botones">Iniciar Sesión</button>
            </a>
        </div>
    </form>
</div>

{% endblock %}
